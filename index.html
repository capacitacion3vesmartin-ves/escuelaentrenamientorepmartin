<style>

*{box-sizing:border-box;margin:0}

button,input,select,textarea{font:inherit;color:inherit}
#strip{position:sticky;top:0;z-index:20;height:var(--sh);display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#1c2b45,#2a3d5f);color:#fff;font-weight:800;font-size:15px;border-bottom:3px solid var(--o);text-align:center;padding:0 10px}

.ctl label{font-size:11px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;gap:2px}

.btn{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.pr{background:var(--g);border-color:var(--g);color:#fff}.btn.dg{color:var(--F)}.btn:disabled,.tg:disabled,.st button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--o)}
.st{display:flex;gap:6px}
.st button{width:42px;height:38px;border:1.5px solid var(--ln);background:#fff;border-radius:8px;font-weight:800;cursor:pointer;color:var(--mu)}
.st button.on{color:#fff;border-color:transparent}
.st .P.on{background:var(--P)}.st .T.on{background:var(--T)}.st .F.on{background:var(--F)}.st .R.on{background:var(--R)}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;font-size:14px;margin:6px 0 10px}
.sum span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.tg{border:1.5px solid var(--ln);background:#fff;border-radius:20px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mu)}
.tg.on{background:var(--g);border-color:var(--g);color:#fff}
.ar,.sd{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.ar{background:#e3f4e9;color:var(--gd)}.sd{background:#fdebd3;color:#a45500}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}

.nota{width:80px;text-align:center;font-weight:700}

.msg{color:var(--mu);padding:24px 0;text-align:center}.mu{color:var(--mu);font-weight:600;font-size:13px}.rol{background:#fff4e0;border:1px solid #f3d29b;color:#7a4a00;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.pt{border-radius:20px;padding:3px 12px;font-weight:800;font-size:13px;color:#fff;background:var(--c)}
a{color:var(--gd);font-weight:600}h3{font-size:16px;margin-bottom:8px;color:#1c2b45}

.sl{font-size:12px;color:var(--mu);font-weight:600;text-decoration:underline dotted;display:inline-block;margin-top:2px}

.rp{background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(20,40,30,.06)}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:16px 20px 6px}.kp div{border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px}.kp b{display:block;font-size:26px;color:var(--c)}.kp small{color:var(--mu);font-weight:600;font-size:12px}

.cal{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px;min-width:650px}
.cal .hd{text-align:center;font-weight:800;font-size:15px;color:#fff;background:var(--sc);border-radius:8px;padding:9px 4px}
.cl{border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:#fff;min-height:88px;display:flex;flex-direction:column;font-size:11px}.cl.e{background:#f7f9f7}.cl.hoy{outline:2px solid var(--o)}
.cl .dn{background:#0b3d3a;color:#fff;text-align:center;font-weight:800;padding:3px;font-size:12px}

.ov{position:fixed;inset:0;background:rgba(20,30,25,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%;line-height:1.5;max-height:92vh;overflow:auto}.dlg b{color:var(--gd)}

.seg button small{opacity:.75;font-weight:600;margin-left:4px}
.gh{border-top:4px solid var(--sc)}
.sub{margin:14px 0 10px;padding-top:14px;border-top:1px dashed var(--ln)}

async function lockVer(){if(waitL())return;if(await hash('esc',$('#lgp').value.trim())!==LH.bc){msgF('Clave incorrecta. Inténtalo de nuevo.');$('#lgp').select();return}LE=0;
  pinScreen($('#blq'),{n:6,c:'#374151',small:'Segunda validación',title:'Ingresa tu PIN',top:`<div class="blk">${sv('k')}</div><h1>Pantalla bloqueada</h1>`,back:'lock',verify:async()=>{if(waitL())return;const v=pinVal();if(v.length<6)return msgF('Escribe los 6 dígitos.',false);if(await hash('esc',v)!==LH.bp){msgF('PIN incorrecto.');pinClr();return}LE=0;try{sessionStorage.removeItem('esc_blq')}catch(e){}$('#blq').style.display='none';$('#blq').innerHTML='';$('#app').inert=false}})}
function start(){S.sede=AU==='MASTER'?'all':AU;$('#app').hidden=false;$('#app').inert=false;R();scrollTo(0,0)}

/* ---------- avisos de personal repetido ---------- */
const nn=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
function buscaDup(nombre){const a=nn(nombre);if(!a.length)return [];const out=[];D.alumnos.forEach(x=>{const b=nn(x.nombre);if(!b.length)return;if([...a].sort().join(' ')===[...b].sort().join(' ')){out.push({a:x,t:'completo'});return}const c=a.length<=b.length?a:b,l=a.length<=b.length?b:a;if(c.length>=2&&c.every(w=>l.includes(w)))out.push({a:x,t:'parecido'})});return out}
function dupHint(){const n=$('#an'),d=$('#ad'),wn=$('#anw'),wd=$('#adw');if(wn&&n){const r=buscaDup(n.value);wn.textContent=r.length?(r.some(x=>x.t==='completo')?'⚠ Ya registrado con ese nombre completo: ':'⚠ Se parece a: ')+r.slice(0,3).map(x=>x.a.nombre).join(', '):''}if(wd&&d){const v=d.value.trim(),x=v&&D.alumnos.find(a=>a.dni===v);wd.textContent=x?'⚠ Ese DNI ya está registrado: '+x.nombre:''}}
/* ---------- varios grupos + aviso ---------- */
function aviso(t){let e=$('#avso');if(!e){e=document.createElement('div');e.id='avso';e.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:70;background:#1c2b45;color:#fff;font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .4s;max-width:90vw;text-align:center;pointer-events:none';document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>{e.style.opacity=0},4500)}
function addGrupo(i,g){if(g.al.includes(i))return false;const otros=D.grupos.filter(x=>x.mes===g.mes&&x.id!==g.id&&x.al.includes(i));g.al.push(i);if(otros.length)aviso(alu(i).nombre+' ahora también está en '+g.nombre+' (ya estaba en '+otros.map(x=>x.nombre).join(', ')+').');return true}
/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(!Object.keys(d).length||d.d)return;
  if(d.eye){const i=$('#'+d.eye);i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'Ver':'Ocultar';return}
  if(d.lg){lgClave(d.lg);return}
  if('lgback' in d){lgSedes();return}
  if(d.lgok){lgVer(d.lgok);return}
  if('bkok' in d){lockVer();return}
  if('pok' in d){if(PV)PV();return}
  if(d.pback){d.pback==='login'?lgSedes():lockClave();return}
  if('lock' in d){if(!await confirmarSN('<h3 style="font-size:17px">¿Deseas bloquear ahora?</h3><p>La pantalla se bloqueará hasta que ingreses la clave y el PIN.</p>'))return;lockClave();return}
  if('logout' in d){if(!await confirmar('<h3 style="font-size:17px">¿Cerrar sesión?</h3><p>Volverás a la pantalla de ingreso.</p>'))return;if(!await hojaFlush()&&!await confirmar('<h3 style="font-size:17px">Hay cambios sin guardar</h3><p>No se pudieron enviar a la hoja. Si cierras sesión podrías perderlos.</p>'))return;hojaSalir();return}
  if(d.col){COL[d.col]=!COL[d.col];if(!COL[d.col])delete COL[d.col];try{localStorage.setItem('esc_colapsados',JSON.stringify(COL))}catch(err){}return R()}
  if('sing' in d){S.sinG=!S.sinG;return R()}
  if(d.area!==undefined){S.area=d.area;return R()}
  if(d.pg){S.pg=d.pg;return R()}
  if(d.ag){S.ag=d.ag;S.add=false;return R()}
  if(d.rv){S.rv=d.rv;return R()}
  if(d.rg){S.rg=d.rg;return R()}
  if('addtgl' in d){S.add=!S.add;return R()}
  if('hoy' in d){S.fecha=iso(today);S.mes=S.fecha.slice(0,7);S.rg='';return R()}
  if(d.dl||d.dlp){const g=grp(d.dl||d.dlp);t.disabled=true;await descargar(repCard(g,false,true),'reporte-'+slug(g.sede)+'-'+slug(g.nombre)+'-'+S.fecha,repTxt(g),d.dlp?'pdf':'img');t.disabled=false;return}
  if(d.dla||d.dlap){const id=d.dla||d.dlap,a=alu(id);t.disabled=true;await descargar(asCard(id,true),'reporte-asesor-'+slug(a.nombre)+'-'+S.fecha,asTxt(id),d.dlap?'pdf':'img');t.disabled=false;return}
  if(d.cop||d.copa){const x=d.cop?repTxt(grp(d.cop)):asTxt(d.copa);try{await navigator.clipboard.writeText(x);t.textContent='¡Copiado!';setTimeout(()=>t.textContent='Copiar reporte',1500)}catch(err){prompt('Copia el reporte:',x)}return}
  if(RO()&&!d.t&&!('exp' in d))return alert('Estás en Master: solo lectura. Elige una sede para editar.');
  if(d.t){S.tab=d.t;if(d.t==='rep'||d.t==='repa'){S.fecha=iso(today);S.mes=S.fecha.slice(0,7);S.rg=''}}
  else if(d.a){const day=D.asist[S.fecha]=D.asist[S.fecha]||{};day[d.a]===d.v?delete day[d.a]:day[d.a]=d.v}
  else if(d.all){const day=D.asist[S.fecha]=D.asist[S.fecha]||{};mem(grp(d.all)).forEach(i=>day[i]=day[i]||'P')}
  else if('addtema' in d){const ti=$('#tt').value.trim();if(!ti)return $('#tt').focus();const x={id:uid(),titulo:ti,link:fixLink($('#tl').value),fechas:[],fecha:'',desc:$('#td').value.trim(),sede:S.sede},sg=$('#tg').value,g=sg?grp(sg):null;if(g){const r=await fechaDlg(g,x);if(r===null)return;g.te.push(x.id);setGF(g,x,r)}D.temas.push(x)}
  else if(d.edt){const x=tem(d.edt),r=await temaDlg(x);if(!r)return;x.titulo=r.titulo;x.link=fixLink(r.link);x.desc=r.desc;r.all.forEach(id=>{const g=grp(id),i=g.te.indexOf(x.id),w=r.gids.includes(id);if(w&&i<0)g.te.push(x.id);if(!w&&i>=0){g.te.splice(i,1);setGF(g,x,[])}})}
  else if(d.fg){const g=grp(d.fg),x=tem(d.tid),r=await fechaDlg(g,x);if(r===null)return;setGF(g,x,r)}
  else if(d.deltema){if(!await confirmar('¿Eliminar este tema y sus notas?'))return;D.temas=D.temas.filter(z=>z.id!==d.deltema);delete D.notas[d.deltema];D.grupos.forEach(g=>{g.te=g.te.filter(z=>z!==d.deltema);if(g.tf)delete g.tf[d.deltema]})}
  else if(d.unas){const g=grp(d.unas);g.te=g.te.filter(z=>z!==d.tid);if(g.tf)delete g.tf[d.tid]}
  else if('ng' in d){const r=await grupoDlg();if(!r)return;D.grupos.push({id:uid(),nombre:r.nombre,dias:r.dias,sede:S.sede,mes:S.mes,al:[],te:[],tf:{}})}
  else if(d.eg){const g=grp(d.eg),r=await grupoDlg(g);if(!r)return;g.nombre=r.nombre;g.dias=r.dias}
  else if(d.dg){if(!await confirmar('¿Eliminar este grupo? Los alumnos y temas no se borran, solo quedan sin grupo.'))return;D.grupos=D.grupos.filter(g=>g.id!==d.dg);Object.keys(D.rep).filter(k=>k.endsWith('|'+d.dg)).forEach(k=>delete D.rep[k])}
  else if('addal' in d){const dn=$('#ad').value.trim(),n=$('#an').value.trim(),c=$('#ac').value.trim();if(!dn){alert('Escribe el DNI (será su usuario).');return $('#ad').focus()}if(!n){alert('Escribe el nombre y apellido.');return $('#an').focus()}if(!c){alert('Falta la contraseña: no se puede registrar a la persona sin contraseña.');return $('#ac').focus()}if(D.alumnos.some(a=>a.dni===dn))return alert('Ya existe una persona con ese DNI.');const dp=buscaDup(n);if(dp.length){const cmp=dp.some(x=>x.t==='completo');if(!await confirmar('<h3 style="font-size:17px">'+(cmp?'Ya registraste a esta persona':'Podría estar repetida')+'</h3><p>'+(cmp?'Ya existe con el mismo nombre completo: ':'Se parece a: ')+dp.slice(0,4).map(x=>'<b>'+esc(x.a.nombre)+'</b> (DNI '+esc(x.a.dni)+')').join(', ')+'.</p><p>¿Registrarla de todos modos?</p>'))return}const foto=$('#af').value.trim();D.alumnos.push({id:uid(),nombre:n.toUpperCase(),dni:dn,area:$('#aa').value,sede:S.sede,foto,tel:$('#atl').value.trim(),correo:$('#acr').value.trim(),ingreso:$('#ain').value,clave:c,h:await hash(dn,c)});S.add=true}
  else if(d.eal){const a=alu(d.eal),r=await personalDlg(a);if(!r)return;a.nombre=r.nombre;a.foto=r.foto;a.area=r.area;a.tel=r.tel;a.correo=r.correo;a.ingreso=r.ingreso;if(r.clave){a.h=await hash(a.dni,r.clave);a.clave=r.clave}}
  else if(d.qg){const g=grp(d.qgg);if(g)g.al=g.al.filter(z=>z!==d.qg)}
  else if('addarea' in d){const n=(prompt('Nombre de la nueva área')||'').trim();if(!n)return;if(!D.areas.includes(n))D.areas.push(n)}
  else if(d.clave){const c=(prompt('Nueva contraseña')||'').trim();if(!c)return;const a=alu(d.clave);a.h=await hash(a.dni,c);a.clave=c}
  else if(d.delal){if(!await confirmar('¿Eliminar alumno y sus registros?'))return;const i=d.delal;D.alumnos=D.alumnos.filter(a=>a.id!==i);D.grupos.forEach(g=>g.al=g.al.filter(z=>z!==i));Object.values(D.asist).forEach(x=>delete x[i]);Object.values(D.notas).forEach(x=>delete x[i]);D.puntos=D.puntos.filter(p=>p.al!==i)}
  else if('exp' in d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='datos.json';a.click();return}
  else if(d.pd){const al=d.pd,sg=+d.sg,r=await puntosDlg(al,sg);if(!r)return;D.puntos.push({id:uid(),al,pts:sg*r.n,fe:r.fe,mo:r.mo,tipo:sg>0?'extra':'canje'})}
  else if(d.delpt){if(!await confirmar('¿Eliminar este movimiento de puntos?'))return;D.puntos=D.puntos.filter(p=>p.id!==d.delpt)}
  else if(d.rt){const k=S.fecha+'|'+d.gid,r=D.rep[k]=D.rep[k]||{};r.te=r.te||[];const i=r.te.indexOf(d.rt);i<0?r.te.push(d.rt):r.te.splice(i,1)}
  else return;
  save();R();
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='sede'){S.sede=t.value;S.tema='';S.pg='';S.ag='';S.rg='';S.ra='';R()}
  else if(t.id==='mes'&&t.value){S.mes=t.value;if(['asis','rep','repa'].includes(S.tab))S.fecha=S.mes+'-01';R()}
  else if(t.id==='fecha'&&t.value){S.fecha=t.value;S.mes=t.value.slice(0,7);S.rg='';R()}
  else if(t.id==='tema'){S.tema=t.value;R()}
  else if(t.id==='cini'||t.id==='cfin'){const x=D.crono[S.sede]=D.crono[S.sede]||{};x[t.id==='cini'?'ini':'fin']=t.value;save();R()}
  else if(t.id==='asesor'){S.ra=t.value;R()}
  else if(t.id==='rgsel'){S.rg=t.value;R()}
  else if(RO())return;
  else if(d.n){const N=D.notas[S.tema]=D.notas[S.tema]||{};t.value===''?delete N[d.n]:N[d.n]=Math.min(20,Math.max(0,+t.value));save();R()}
  else if(d.ar){alu(d.ar).area=t.value;save();R()}
  else if(d.gal){const g=grp(t.value);if(g)addGrupo(d.gal,g);save();R()}
  else if(d.sug){if(!t.value)return;const g=grp(d.sug),x=tem(t.value);if(!x||g.te.includes(x.id))return;(async()=>{const r=await fechaDlg(g,x);if(r!==null){g.te.push(x.id);setGF(g,x,r);save()}R()})();return}
  else if(d.asg){if(!t.value)return;const g=grp(t.value),x=tem(d.asg);if(!x||g.te.includes(x.id))return;(async()=>{const r=await fechaDlg(g,x);if(r!==null){g.te.push(x.id);setGF(g,x,r);save()}R()})();return}
  else if(t.id==='imp'&&t.files[0]){t.files[0].text().then(x=>{try{D=Object.assign(DEF(),JSON.parse(x));norm();migra();save();R();alert('Datos importados.')}catch(err){alert('El archivo no es válido.')}})}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('pn')){t.value=t.value.replace(/\D/g,'').slice(0,1);const i=+t.id.slice(2);if(t.value&&i<PN-1)$('#pn'+(i+1)).focus();if(t.value&&i===PN-1&&PV)PV();return}
  if(t.id==='an'||t.id==='ad'){dupHint();return}
  if(t.id==='ro'){if(RO())return;const k=S.fecha+'|'+t.dataset.gid,r=D.rep[k]=D.rep[k]||{};r.obs=t.value;save();return}
  const bm={busq:'busq',busqp:'bp',busqpe:'bpe'};if(bm[t.id]){S[bm[t.id]]=t.value;const p=t.selectionStart,id=t.id;R();const b=$('#'+id);b.focus();b.setSelectionRange(p,p)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Backspace'&&e.target.classList&&e.target.classList.contains('pn')&&!e.target.value){const i=+e.target.id.slice(2);if(i>0)$('#pn'+(i-1)).focus()}
  if(e.key==='Enter'){if(e.target.id==='lgp'){const b=$('[data-lgok]')||$('[data-bkok]');if(b)b.click()}}
});
/* arrastrar personal a grupos */
let COL={};try{COL=JSON.parse(localStorage.getItem('esc_colapsados'))||{}}catch(e){}
let DRG=null,DRGG=null;
const zona=e=>e.target.closest?e.target.closest('[data-drop]'):null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-pdrag]');if(!t||RO())return;DRG=t.dataset.pdrag;{const zz=t.closest('[data-drop]');DRGG=zz?zz.dataset.drop:null}e.dataTransfer.setData('text/plain',DRG);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=zona(e);if(!z||!DRG)return;e.preventDefault();document.querySelectorAll('.ov2').forEach(x=>x.classList.remove('ov2'));z.classList.add('ov2')});
document.addEventListener('dragend',()=>{DRG=null;document.querySelectorAll('.ov2').forEach(x=>x.classList.remove('ov2'))});
document.addEventListener('drop',e=>{const z=zona(e);if(!z||!DRG||RO())return;e.preventDefault();const i=DRG,src=DRGG,a=D.alumnos.find(x=>x.id===i),g=z.dataset.drop==='-'?null:grp(z.dataset.drop);DRG=null;DRGG=null;document.querySelectorAll('.ov2').forEach(x=>x.classList.remove('ov2'));if(!a||(g&&g.sede!==a.sede))return;if(g)addGrupo(i,g);else if(src&&src!=='-'){const o=grp(src);if(o)o.al=o.al.filter(k=>k!==i)}else return;save();R()});
/* arranque */
let blq=false;try{blq=sessionStorage.getItem('esc_blq')==='1'}catch(e){}
if(AU){iniciar().then(()=>{if(blq&&AU)lockClave()})}else lgSedes();
</script></body></html>
